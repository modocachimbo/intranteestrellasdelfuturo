<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ingreso · Estrellas del Futuro</title>
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/styles.css?v=202611071559">
</head>
<body>
<div class="login-page">
  <svg class="stars a" aria-hidden="true"><use href="#deco-stars"></use></svg>
  <svg class="stars b" aria-hidden="true"><use href="#deco-stars"></use></svg>

  <main class="login-card">
    <section class="login-art">
      <img src="logo.png" alt="Logo de IEP Las Estrellas del Futuro">
    </section>

    <section class="login-form">
      <form action="panel.html" method="get" class="login-form" style="padding:0">
        <h1>¡Bienvenido!</h1>
        <p class="lead">Ingresa a tu intranet</p>

        <div class="field-col">
          <label for="codigo">Código de usuario</label>
          <input class="input" id="codigo" name="codigo" type="text" autocomplete="username" placeholder="Ej. 77703588" aria-describedby="codigo-ayuda">
          <span class="hint" id="codigo-ayuda">Te lo entrega la administración del colegio.</span>
        </div>

        <div class="field-col">
          <label for="clave">Contraseña</label>
          <div class="pw">
            <input class="input" id="clave" name="clave" type="password" autocomplete="current-password" placeholder="••••••••">
            <button id="ver-clave" type="button" aria-label="Mostrar contraseña"><svg class="ico" aria-hidden="true"><use href="#i-eye"></use></svg></button>
          </div>
        </div>

        <button class="btn btn-primary btn-pill" type="submit">Ingresar</button>

        <div class="login-links">
          <a href="#">¿Olvidaste tu contraseña?</a>
          <span>¿No tienes código? <a href="#">Comunícate con la administración</a></span>
        </div>
      </form>
    </section>
  </main>
  <p class="login-foot">© 2026 IEP Las Estrellas del Futuro · Mazo, Végueta</p>
</div>
<script src="assets/js/app.js?v=202611071559"></script>
</body>
</html>
